<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Oficial - Bolão Copa 2026</title>
    <style>
        :root {
            --bg-principal: #f8f9fa;
            --azul-copa: #0d6efd;
            --texto-escuro: #212529;
            --borda: #dee2e6;
            --cinza-intercalado: #f1f5f9; /* Cor cinza claro para o efeito zebra */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-escuro);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 { margin: 0 0 10px 0; color: #0f172a; font-size: 28px; }
        .atualizacao { color: #64748b; font-size: 14px; }

        /* Estilo do Ranking / Pódio */
        .ranking-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .ranking-box h2 { margin-top: 0; color: var(--azul-copa); }
        .ranking-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .rank-card {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .rank-card .pontos {
            background: var(--azul-copa);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Tabela Matriz Geral */
        .tabela-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 15px;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid var(--borda);
            white-space: nowrap;
        }

        th {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        /* Estrutura invisível alinhada para os Times e Gols */
        .col-confronto {
            min-width: 220px;
            padding: 8px 15px;
        }

        .linha-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            height: 24px;
        }

        .nome-time {
            text-align: left;
        }

        .gol-real {
            background: #e2e8f0;
            color: #0f172a;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 14px;
            min-width: 12px;
            text-align: center;
        }

        .espaco-jogo {
            height: 6px;
        }

        /* INTERCALAÇÃO DE DIRETRIZ: Efeito Zebra por jogo completo (Linha sim, linha não) */
        tr:nth-child(even) {
            background-color: var(--cinza-intercalado);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            th, td { padding: 8px 10px; font-size: 13px; }
            .col-confronto { min-width: 180px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏆 BOLÃO COPA DO MUNDO 2026 ⚽</h1>
        <div class="atualizacao" id="data-atualizacao">Carregando dados...</div>
    </header>

    <div class="ranking-box">
        <h2>📊 Classificação Geral</h2>
        <div class="ranking-grid" id="ranking-container"></div>
    </div>

    <div class="tabela-container">
        <table id="tabela-bolao">
            <thead>
                <tr id="cabecalho-tabela">
                    <th>Confronto</th>
                    </tr>
            </thead>
            <tbody id="corpo-tabela">
                </tbody>
        </table>
    </div>
</div>

<script>
    fetch('dados.json?t=' + new Date().getTime()) // Força o navegador a buscar os dados novos sem cache
        .then(response => response.json())
        .then(data => {
            document.getElementById('data-atualizacao').innerText = "Última atualização oficial: " + data.atualizadoEm;

            // 1. Monta o Grid de Ranking Ordenado
            const rankingContainer = document.getElementById('ranking-container');
            data.ranking.forEach((pos, index) => {
                const card = document.createElement('div');
                card.className = 'rank-card';
                card.innerHTML = `<span>${index + 1}° ${pos.nome}</span> <span class="pontos">${pos.pontos} pts</span>`;
                rankingContainer.appendChild(card);
            });

            // 2. Monta o Cabeçalho da Tabela com os Amigos
            const cabecalho = document.getElementById('cabecalho-tabela');
            data.ranking.forEach(amigo => {
                const th = document.createElement('th');
                th.innerText = amigo.nome;
                cabecalho.appendChild(th);
            });

            // 3. Varre os jogos e monta a matriz na tela
            const corpoTabela = document.getElementById('corpo-tabela');
            
            data.jogos.forEach(jogo => {
                const tr = document.createElement('tr');
                
                // Quebra a string do resultado real para pegar os gols separados
                let gol1 = "-";
                let gol2 = "-";
                if (jogo.resultadoReal && jogo.resultadoReal !== "A jogar") {
                    const partes = jogo.resultadoReal.split("x");
                    if (partes.length === 2) {
                        gol1 = partes[0].trim();
                        gol2 = partes[1].trim();
                    }
                }
                
                // Coluna 1: Confronto com a estrutura invisível (Time à esquerda | Gol à direita)
                const tdConfronto = document.createElement('td');
                tdConfronto.className = 'col-confronto';
                tdConfronto.innerHTML = `
                    <div class="linha-time">
                        <span class="nome-time">${jogo.time1}</span>
                        <span class="gol-real">${gol1}</span>
                    </div>
                    <div class="espaco-jogo"></div>
                    <div class="linha-time">
                        <span class="nome-time">${jogo.time2}</span>
                        <span class="gol-real">${gol2}</span>
                    </div>
                `;
                tr.appendChild(tdConfronto);

                // Colunas seguintes: Palpites de cada amigo na ordem do Ranking
                data.ranking.forEach(amigo => {
                    const tdPalpite = document.createElement('td');
                    const dadosPalpite = jogo.palpites[amigo.nome];

                    if (dadosPalpite) {
                        tdPalpite.innerText = dadosPalpite.placar !== "" ? dadosPalpite.placar : "-";
                        
                        // Resgata a cor exata calculada pelo Google Sheets
                        if (dadosPalpite.cor && dadosPalpite.cor !== "#ffffff") {
                            tdPalpite.style.backgroundColor = dadosPalpite.cor;
                        }
                    } else {
                        tdPalpite.innerText = "-";
                    }
                    tr.appendChild(tdPalpite);
                });

                corpoTabela.appendChild(tr);
            });
        })
        .catch(error => {
            console.error("Erro ao ler dados do bolão:", error);
            document.getElementById('data-atualizacao').innerText = "Erro ao carregar dados do painel.";
        });
</script>

</body>
</html>
